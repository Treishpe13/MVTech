<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#063074">
<title>MVTech Service</title>
<link rel="manifest" id="manifest">
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
:root{--blue:#063074;--blue2:#0B4AA6;--red:#FF4437;--gray:#808782;--bg:#F4F6F9;--border:#D7DDE4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#1f2937}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:800}header h1 b{color:var(--red)}
header .sub{font-size:11px;color:#cbd8ea}
#status{margin-left:auto;font-size:10px;padding:4px 8px;border-radius:10px;background:rgba(255,255,255,.15)}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--border);background:#fff;padding:12px 14px;width:100%;margin-top:8px}
button.primary{background:var(--blue);color:#fff;border:none}
button.danger{color:var(--red);border-color:#F3C1BD}
button:disabled{opacity:.5}
input,textarea,select{font:inherit;width:100%;border:1px solid var(--border);border-radius:9px;padding:10px;margin:4px 0 10px;background:#fff}
label{font-size:12px;font-weight:700;color:var(--gray)}
h2{font-size:14px;margin:0 0 8px;color:var(--blue)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:13px}
.kv div:nth-child(odd){color:var(--gray)}
.kv div:nth-child(even){font-weight:600}
.ev{border-left:3px solid var(--blue2);padding:6px 10px;margin:8px 0;background:#f8fafc;border-radius:0 8px 8px 0;font-size:12px}
.ev .d{color:var(--gray);font-size:11px}
video{width:100%;border-radius:12px;background:#000}
canvas.sig{width:100%;height:150px;border:1.5px dashed var(--border);border-radius:10px;background:#fff;touch-action:none}
.badge{display:inline-block;background:#e9eff4;color:var(--blue);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:6px}
.hint{font-size:11px;color:var(--gray)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;display:none;z-index:9}
.photos{display:flex;gap:6px;flex-wrap:wrap}.photos img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
</style>
</head>
<body>
<header>
  <svg width="30" height="30" viewBox="0 0 100 100"><polygon points="50,6 90,28 90,72 50,94 10,72 10,28" fill="none" stroke="#fff" stroke-width="9"/><polygon points="50,26 72,38 72,62 50,74 28,62 28,38" fill="#FF4437"/></svg>
  <div><h1><b>MV</b>Tech Service</h1><div class="sub" id="sub">v0.1</div></div>
  <div id="status">offline</div>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>
/* ================== CONFIG - completeaza inainte de publicare ================== */
const CFG = {
  tenantId:  "TENANT_ID_AICI",
  clientId:  "CLIENT_ID_AICI",           // acelasi App Registration ca desktopul
  driveMode: "onedrive",                  // "onedrive" sau "site"
  siteUrl:   "",                          // ex: "contoso.sharepoint.com/sites/Service" (doar pt mode=site)
  remoteDir: "/MVTech Service Hub"        // folderul unde sta mvtech_service.db
};
/* =============================================================================== */
const SCOPES = ["Files.ReadWrite.All"];
const GRAPH = "https://graph.microsoft.com/v1.0";
let msalApp=null, account=null, snapshot=null, currentMachine=null;
let photos=[], sigDirty=false, stream=null, scanTimer=null;

const $=s=>document.querySelector(s);
const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)};
const setStatus=t=>$("#status").textContent=t;

function drivePrefix(){
  if(CFG.driveMode==="onedrive") return `${GRAPH}/me/drive`;
  const u=CFG.siteUrl.replace(/^https?:\/\//,"");
  const host=u.split("/")[0]; const path=u.substring(host.length);
  return `${GRAPH}/sites/${host}:${path}:/drive`;   // rezolvat la runtime prin /sites
}
async function graphSite(){ // pentru mode=site: obtine drive id real
  if(CFG.driveMode==="onedrive") return `${GRAPH}/me/drive`;
  const u=CFG.siteUrl.replace(/^https?:\/\//,""); const host=u.split("/")[0];
  const path=u.substring(host.length)||"/";
  const s=await gfetch(`${GRAPH}/sites/${host}:${path}`); const site=await s.json();
  return `${GRAPH}/sites/${site.id}/drive`;
}
let BASE=null;
async function base(){ if(!BASE) BASE=await graphSite(); return BASE; }

async function token(){
  const req={scopes:SCOPES, account};
  try{ return (await msalApp.acquireTokenSilent(req)).accessToken; }
  catch(e){
    try{ const r=await msalApp.acquireTokenPopup(req); account=r.account; return r.accessToken; }
    catch(e2){ await msalApp.acquireTokenRedirect(req); throw e2; } // iOS standalone: popup blocat
  }
}
async function gfetch(url, opt={}){
  const t=await token();
  opt.headers=Object.assign({Authorization:"Bearer "+t}, opt.headers||{});
  const r=await fetch(url,opt);
  if(!r.ok && r.status!==404) throw new Error("Graph "+r.status);
  return r;
}

/* ---------- sign in ---------- */
async function init(){
  msalApp=new msal.PublicClientApplication({auth:{
    clientId:CFG.clientId, authority:"https://login.microsoftonline.com/"+CFG.tenantId,
    redirectUri:location.origin+location.pathname},
    cache:{cacheLocation:"localStorage"}});
  await msalApp.initialize();
  const r=await msalApp.handleRedirectPromise().catch(()=>null);
  if(r){ account=r.account; }
  if(!account){const accs=msalApp.getAllAccounts(); if(accs.length) account=accs[0];}
  snapshot=JSON.parse(localStorage.getItem("mv_snapshot")||"null");
  renderHome();
  if(account){ setStatus(account.username.split("@")[0]); refreshSnapshot(); flushQueue(); }
  else setStatus("neconectat");
  window.addEventListener("online",()=>{flushQueue();refreshSnapshot();});
}
async function signIn(){
  try{
    const r=await msalApp.loginPopup({scopes:SCOPES});
    account=r.account;
  }catch(e){                       // iOS PWA standalone blocheaza popup-urile
    await msalApp.loginRedirect({scopes:SCOPES});
    return;                        // continua in handleRedirectPromise dupa revenire
  }
  setStatus(account.username.split("@")[0]);
  await refreshSnapshot(); renderHome();
}

/* ---------- snapshot ---------- */
async function refreshSnapshot(){
  if(!navigator.onLine||!account) return;
  try{
    const b=await base();
    const r=await gfetch(`${b}/root:${encodeURI(CFG.remoteDir)}/mobile/machines.json:/content`);
    if(r.status===404){toast("Snapshotul lipseste — ruleaza un sync din desktop");return;}
    snapshot=await r.json();
    localStorage.setItem("mv_snapshot", JSON.stringify(snapshot));
    setStatus((account.username.split("@")[0])+" · "+snapshot.machines.length+" masini");
  }catch(e){ console.warn(e); }
}

/* ---------- offline queue ---------- */
function queue(){ return JSON.parse(localStorage.getItem("mv_queue")||"[]"); }
function setQueue(q){ localStorage.setItem("mv_queue", JSON.stringify(q)); }
async function flushQueue(){
  if(!navigator.onLine||!account) return;
  let q=queue(); if(!q.length) return;
  const b=await base(); let sent=0;
  for(const item of [...q]){
    try{
      await gfetch(`${b}/root:${encodeURI(CFG.remoteDir)}/mobile/inbox/${item.name}:/content`,
        {method:"PUT", headers:{"Content-Type":"application/json"},
         body:JSON.stringify(item.report)});
      q=q.filter(x=>x.name!==item.name); setQueue(q); sent++;
    }catch(e){ console.warn("queue send",e); break; }
  }
  if(sent) toast(sent+" raport(e) trimise pe server");
}

/* ---------- QR scan ---------- */
async function startScan(){
  renderScan();
  const video=$("#cam");
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    video.srcObject=stream; await video.play();
  }catch(e){ toast("Camera indisponibila: "+e.message); return; }
  const det=("BarcodeDetector" in window)? new BarcodeDetector({formats:["qr_code"]}) : null;
  const cv=document.createElement("canvas"); const ctx=cv.getContext("2d",{willReadFrequently:true});
  scanTimer=setInterval(async ()=>{
    if(!video.videoWidth) return;
    let code=null;
    if(det){ try{const codes=await det.detect(video); if(codes.length) code=codes[0].rawValue;}catch(e){} }
    else{
      cv.width=video.videoWidth; cv.height=video.videoHeight;
      ctx.drawImage(video,0,0);
      const d=ctx.getImageData(0,0,cv.width,cv.height);
      const r=jsQR(d.data,cv.width,cv.height);
      if(r) code=r.data;
    }
    if(code){ stopScan(); openByQr(code.trim().toUpperCase()); }
  },350);
}
function stopScan(){ if(scanTimer)clearInterval(scanTimer); scanTimer=null;
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;} }

function openByQr(code){
  if(!snapshot){toast("Nu exista date locale — conecteaza-te intai");renderHome();return;}
  const m=snapshot.machines.find(x=>x.qr===code);
  if(!m){ if(confirm("Codul "+code+" nu e inregistrat.\nInregistrezi o masina noua cu acest cod?"))
            renderNewMachine(code);
          else renderHome();
          return; }
  currentMachine=m; renderMachine(m);
}

/* ---------- UI ---------- */
function renderHome(){
  stopScan();
  $("#app").innerHTML=`
   ${account?"":`<div class="card"><h2>Conectare</h2>
     <p class="hint">Foloseste contul Microsoft al firmei.</p>
     <button class="primary" onclick="signIn()">Sign in Microsoft</button></div>`}
   <div class="card"><h2>Scaneaza echipament</h2>
     <button class="primary" onclick="startScan()" ${snapshot?"":"disabled"}>📷 Scaneaza QR</button>
     <label>sau cauta manual (cod / serial / client)</label>
     <input id="q" placeholder="MV7K2P… / MY10133… / Jabil" oninput="searchList()">
     <div id="results"></div></div>
   <div class="card"><h2>Stare</h2>
     <div class="kv">
      <div>Masini locale:</div><div>${snapshot? snapshot.machines.length : "—"}</div>
      <div>Snapshot:</div><div>${snapshot? snapshot.generated.replace("T"," ").slice(0,16):"—"}</div>
      <div>In coada offline:</div><div>${queue().length} raport(e)</div></div>
     <button onclick="refreshSnapshot().then(renderHome)">Reincarca datele</button></div>`;
}
function searchList(){
  const q=$("#q").value.trim().toLowerCase(); const box=$("#results");
  if(!snapshot||q.length<2){box.innerHTML="";return;}
  const hits=snapshot.machines.filter(m=>
    (m.qr+" "+m.sn+" "+m.cu+" "+m.t+" "+m.mo).toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=hits.map((m,i)=>`<div class="ev" onclick='openM(${JSON.stringify(m.u)})'>
     <b>${m.t} ${m.mo}</b> · ${m.sn}<div class="d">${m.cu}</div></div>`).join("");
}
function openM(u){ const m=snapshot.machines.find(x=>x.u===u); if(m){currentMachine=m;renderMachine(m);} }

function renderScan(){
  $("#app").innerHTML=`<div class="card"><h2>Scanare QR</h2>
    <video id="cam" playsinline muted></video>
    <button class="danger" onclick="stopScan();renderHome()">Anuleaza</button></div>`;
}

function renderMachine(m){
  const hist=(snapshot.history[(m.sn||"").toUpperCase()]||[]);
  $("#app").innerHTML=`
   <div class="card"><h2>${m.t} ${m.mo||""} <span class="badge">${m.qr||"fara QR"}</span></h2>
    <div class="kv">
      <div>Serial:</div><div>${m.sn||"—"}</div>
      <div>Client:</div><div>${m.cu||"—"}</div>
      <div>Locatie:</div><div>${m.lo||"—"}</div>
      <div>Contact:</div><div>${m.ow||"—"}</div>
      <div>Garantie:</div><div>${m.wa||"—"}</div>
      <div>Ultimul PM:</div><div>${m.pmd||"—"}</div>
      <div>Urmatorul PM:</div><div>${m.npd||"—"}</div></div></div>
   <div class="card"><h2>Ultimele interventii</h2>
    ${hist.length? hist.map(h=>`<div class="ev"><div class="d">${h.d} · ${h.by}</div>
       <b>${h.sy||""}</b>${h.so?("<br>"+h.so):""}</div>`).join("") :
       '<p class="hint">Nicio interventie in snapshot.</p>'}
   </div>
   <button class="primary" onclick="renderService()">📝 Inregistreaza service / PM</button>
   <button onclick="renderHome()">Inapoi</button>`;
}

function renderNewMachine(code){
  $("#app").innerHTML=`
   <div class="card"><h2>Masina noua <span class="badge">${code}</span></h2>
    <label>Tip masina *</label><input id="nm_t" placeholder="V810">
    <label>Model</label><input id="nm_mo">
    <label>Serial *</label><input id="nm_sn">
    <label>Data instalarii</label><input id="nm_inst" type="date">
    <label>Client *</label><input id="nm_cu">
    <label>Locatie / fabrica</label><input id="nm_lo">
    <label>Inginer</label><input id="nm_eng">
    <button class="primary" onclick="submitNewMachine('${code}')">Trimite inregistrarea</button>
    <button onclick="renderHome()">Anuleaza</button>
    <p class="hint">Inregistrarea ajunge pe server; desktopul o preia la Import mobile reports.</p></div>`;
}
function submitNewMachine(code){
  const t=$("#nm_t").value.trim(), sn=$("#nm_sn").value.trim(), cu=$("#nm_cu").value.trim();
  if(!t||!sn||!cu){toast("Tip, serial si client sunt obligatorii");return;}
  const rep={kind:"new_machine", qr:code, machine_type:t, model:$("#nm_mo").value.trim(),
    serial:sn, installation_date:$("#nm_inst").value, customer:cu,
    location:$("#nm_lo").value.trim(), engineer:$("#nm_eng").value.trim(),
    date:new Date().toISOString().slice(0,10)};
  enqueue(rep); renderHome();
}

function renderService(){
  photos=[]; sigDirty=false;
  const m=currentMachine;
  $("#app").innerHTML=`
   <div class="card"><h2>Service — ${m.t} ${m.sn}</h2>
    <label>Tip interventie</label>
    <select id="sv_type"><option>PM</option><option>Repair</option><option>Installation</option><option>Inspection</option></select>
    <label>Problema / simptom</label><textarea id="sv_prob" rows="3" placeholder="mesaj de eroare, comportament…"></textarea>
    <label>Lucrari efectuate / solutie</label><textarea id="sv_work" rows="3" placeholder="curatat, gresat, inlocuit…"></textarea>
    <label>Comentarii</label><textarea id="sv_com" rows="2"></textarea>
    <label>Inginer</label><input id="sv_eng" value="${account? account.name||account.username.split("@")[0]:""}">
    <label>Poze (max 6)</label>
    <input type="file" accept="image/*" capture="environment" onchange="addPhoto(this)">
    <div class="photos" id="ph"></div>
    <label>Semnatura client</label>
    <canvas class="sig" id="sig"></canvas>
    <button onclick="clearSig()">Sterge semnatura</button>
    <button class="primary" onclick="submitService()">✔ Finalizeaza si trimite</button>
    <button onclick="renderMachine(currentMachine)">Inapoi</button></div>`;
  initSig();
}
function addPhoto(inp){
  const f=inp.files[0]; if(!f) return;
  if(photos.length>=6){toast("Maxim 6 poze");return;}
  const img=new Image(); const rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{
    const cv=document.createElement("canvas");
    const sc=Math.min(1,1280/Math.max(img.width,img.height));
    cv.width=img.width*sc; cv.height=img.height*sc;
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    photos.push(cv.toDataURL("image/jpeg",0.8).split(",")[1]);
    $("#ph").innerHTML=photos.map(p=>`<img src="data:image/jpeg;base64,${p}">`).join("");
  }; img.src=rd.result;};
  rd.readAsDataURL(f); inp.value="";
}
function initSig(){
  const cv=$("#sig"); const r=cv.getBoundingClientRect();
  cv.width=r.width*2; cv.height=300;
  const ctx=cv.getContext("2d"); ctx.lineWidth=3; ctx.lineCap="round"; ctx.strokeStyle="#0B2C5E";
  let draw=false,lx=0,ly=0;
  const pos=e=>{const b=cv.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return [(t.clientX-b.left)*cv.width/b.width,(t.clientY-b.top)*cv.height/b.height];};
  const dn=e=>{draw=true;[lx,ly]=pos(e);e.preventDefault();};
  const mv=e=>{if(!draw)return;const[x,y]=pos(e);
    ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();[lx,ly]=[x,y];sigDirty=true;e.preventDefault();};
  const up=()=>draw=false;
  cv.addEventListener("mousedown",dn);cv.addEventListener("mousemove",mv);addEventListener("mouseup",up);
  cv.addEventListener("touchstart",dn,{passive:false});cv.addEventListener("touchmove",mv,{passive:false});cv.addEventListener("touchend",up);
}
function clearSig(){const cv=$("#sig");cv.getContext("2d").clearRect(0,0,cv.width,cv.height);sigDirty=false;}
function submitService(){
  const m=currentMachine;
  const work=$("#sv_work").value.trim();
  if(!work && $("#sv_type").value!=="PM"){toast("Descrie lucrarile efectuate");return;}
  const rep={kind:"service", date:new Date().toISOString().slice(0,10),
    serial:m.sn, customer:m.cu, qr:m.qr,
    service_type:$("#sv_type").value,
    problem:$("#sv_prob").value.trim(),
    work: work || ($("#sv_type").value==="PM"?"Preventive maintenance performed":""),
    comment:$("#sv_com").value.trim(),
    engineer:$("#sv_eng").value.trim(),
    photos:photos};
  if(sigDirty) rep.signature=$("#sig").toDataURL("image/png").split(",")[1];
  enqueue(rep); currentMachine=null; renderHome();
}
function enqueue(rep){
  const name=`report_${Date.now()}_${Math.random().toString(36).slice(2,7)}.json`;
  const q=queue(); q.push({name, report:rep}); setQueue(q);
  toast(navigator.onLine? "Se trimite…" : "Salvat offline — se trimite cand apare net");
  flushQueue().then(()=>renderHome());
}

/* PWA manifest inline */
const manifest={name:"MVTech Service",short_name:"MVTech",start_url:".",display:"standalone",
  background_color:"#F4F6F9",theme_color:"#063074",
  icons:[{src:"data:image/svg+xml;base64,"+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#063074"/><polygon points="50,14 84,32 84,68 50,86 16,68 16,32" fill="none" stroke="#fff" stroke-width="7"/><polygon points="50,30 70,40 70,60 50,70 30,60 30,40" fill="#FF4437"/></svg>'),
    sizes:"192x192",type:"image/svg+xml"}]};
$("#manifest").href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(manifest));
init();
</script>
</body>
</html>
